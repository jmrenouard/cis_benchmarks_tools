name: CIS Benchmarks Tools CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pre-commit-and-test:
    name: Pre-Commit Quality Checks & Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run 7-Step Pre-Commit Routine (make pre-commit)
      run: |
        make pre-commit

    - name: Run Automated Unit Tests (unittest)
      run: |
        python3 -m unittest discover -s tests
