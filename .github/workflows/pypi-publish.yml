name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pypi-publish:
    name: Build Distribution & Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Preflight PyPI authentication check
        id: pypi_preflight
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN || secrets.PIPY_API_TOKEN || secrets.PYPI_TOKEN }}
        run: |
          CLEAN_TOKEN=$(printf "%s" "$PYPI_API_TOKEN" | tr -d '\r\n ')
          if [ -n "$CLEAN_TOKEN" ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
            echo "auth_mode=token" >> "$GITHUB_OUTPUT"
            echo "PyPI API Token detected; proceeding with package upload."
            exit 0
          fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            OIDC_RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" || true)
            OIDC_JWT=$(python3 -c "import sys, json; print(json.loads(sys.stdin.read()).get('value', ''))" <<< "$OIDC_RESP" 2>/dev/null || true)
            if [ -n "$OIDC_JWT" ]; then
              MINT_CODE=$(curl -sS -o /tmp/pypi_mint.json -w "%{http_code}" -X POST "https://pypi.org/_/oidc/mint-token" -d "{\"token\":\"$OIDC_JWT\"}" || echo "000")
              if [ "$MINT_CODE" = "200" ]; then
                echo "can_publish=true" >> "$GITHUB_OUTPUT"
                echo "auth_mode=oidc" >> "$GITHUB_OUTPUT"
                echo "PyPI OIDC Trusted Publisher verified (HTTP 200); proceeding with package upload."
                exit 0
              fi
            fi
          fi
          echo "can_publish=false" >> "$GITHUB_OUTPUT"
          echo "auth_mode=none" >> "$GITHUB_OUTPUT"
          echo "::notice title=PyPI Credentials Not Configured::Distribution artifacts (wheel and sdist) built successfully, but neither a PyPI Trusted Publisher nor a PYPI_API_TOKEN / PIPY_API_TOKEN / PYPI_TOKEN secret is configured for this repository. Skipping live PyPI upload."

      - name: Publish package distributions via API Token
        if: steps.pypi_preflight.outputs.auth_mode == 'token'
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN || secrets.PIPY_API_TOKEN || secrets.PYPI_TOKEN }}
        run: |
          twine upload --non-interactive --skip-existing dist/*

      - name: Publish package distributions to PyPI via OIDC
        if: steps.pypi_preflight.outputs.auth_mode == 'oidc'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
