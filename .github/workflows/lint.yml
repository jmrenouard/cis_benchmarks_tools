name: Lint & Type Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff, Flake8 & PSL AST Check (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff flake8

      - name: Run Ruff linter
        run: |
          ruff check . --select=E9,F63,F7,F82
          ruff check . --exit-zero

      - name: Run Flake8 syntax and complexity checks
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run AST Python Standard Library (PSL) & Pre-Commit Checks
        run: python3 scripts/pre_commit_checks.py

  typecheck:
    name: Mypy Type Check (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy

      - name: Run mypy static type analysis
        run: |
          mypy audit_diagnostics.py temporal_metadata.py post_execution_publisher.py --ignore-missing-imports --check-untyped-defs
