name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unittest & Pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install pytest and coverage for CI reporting
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      - name: Run PSL unittest suite
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

      - name: Run pytest with XML & JUnit reports
        env:
          PYTHONUTF8: "1"
        run: pytest tests --junitxml=pytest-results.xml -v

      - name: Upload JUnit test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: pytest-results.xml
          retention-days: 7
